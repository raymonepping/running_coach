global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: running-coach-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8080

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_service
    static_configs:
      - targets:
          - http://backend:8080/api/health
          - http://frontend:5173/
          - http://couchbase:8091/ui/index.html
          - http://vault:8200/v1/sys/health
          - http://ollama:11434/api/tags
          - http://grafana:3000/api/health
        labels:
          probe_group: system
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
